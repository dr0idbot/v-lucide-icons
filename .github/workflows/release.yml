name: Release

# Required repository secrets:
#   GPG_PRIVATE_KEY    - signing private key: ASCII-armored export OR base64-encoded armored export
#   GPG_PASSPHRASE     - passphrase of the signing key
#   CENTRAL_USERNAME   - Sonatype Central publishing token username
#   CENTRAL_PASSWORD   - Sonatype Central publishing token password

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  MAVEN_CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
  MAVEN_CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}

jobs:
  release:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD

      - name: Import GPG signing key
        run: |
          if printf '%s' "$GPG_PRIVATE_KEY" | grep -q 'BEGIN PGP PRIVATE KEY'; then
            printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --yes --import
          else
            printf '%s' "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --yes --import
          fi
          gpg --list-secret-keys --keyid-format long
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Build, test, sign, and publish to Maven Central
        run: mvn -B -P release deploy
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Get project version
        id: version
        run: |
          echo "version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/*.jar \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
