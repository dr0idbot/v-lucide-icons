name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
        vaadin: ['25.1.8', '24.2.0', '24.6.6']

    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ matrix.java }}
        cache: maven
    - name: Build and test
      run: ./mvnw -B -q package -Dvaadin.version=${{ matrix.vaadin }}
